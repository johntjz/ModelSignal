<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>ModelSignal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #06090e;
      color: #f1f5f9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body class="min-h-screen antialiased p-4 md:p-8 max-w-5xl mx-auto space-y-6">

  <!-- HEADER -->
  <header class="flex items-center justify-between border-b border-slate-800 pb-4">
    <div class="flex items-center gap-2.5">
      <span class="h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
      <h1 class="text-sm font-bold tracking-widest text-white uppercase">MODELSIGNAL</h1>
      <span class="text-xs text-slate-500">30 OCT 2026</span>
    </div>
    <div class="text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded">
      <span class="text-slate-400">TOTAL WIN RATE:</span>
      <span id="totalWinRate" class="text-emerald-400 font-bold ml-1">--%</span>
    </div>
  </header>

  <!-- PARALLEL COLUMNS: LEFT = BTC-USD | RIGHT = SOXL -->
  <main id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></main>

  <script>
    const DATA = [
      {
        ticker: "BTC-USD",
        simUSD: "$9,879",
        simChange: "-1.21%",
        priceNow: "$77,344.42",
        priceChange: "-3.00% (Low: $76,418)",
        action: "WAIT IN CASH",
        actionColor: "amber",
        forecastTomorrow: "$75,800.00",
        yesterdayResult: "WIN",
        yesterdayAcc: "99.3%",
        yesterdayCompare: "Forecast $76,800 → Actual $77,344",
        history: [
          { date: "Oct 30", action: "WAIT IN CASH", compare: "$76,800 → $77,344", acc: "99.3%", result: "WIN" },
          { date: "Oct 29 PM", action: "HOLD 50%", compare: "$79,650 → $77,792", acc: "97.6%", result: "LOSS" },
          { date: "Oct 29 AM", action: "HOLD", compare: "$81,650 → $79,993", acc: "97.9%", result: "LOSS" },
          { date: "Oct 28", action: "HOLD", compare: "$80,495 → $81,086", acc: "99.3%", result: "WIN" }
        ]
      },
      {
        ticker: "SOXL",
        simUSD: "$10,107",
        simChange: "+1.07%",
        priceNow: "$84.77",
        priceChange: "-17.21% Overnight (Bid: $88.25)",
        action: "BUY @ $85.00–$88.30",
        actionColor: "emerald",
        forecastTomorrow: "$89.50",
        yesterdayResult: "WIN",
        yesterdayAcc: "92.6%",
        yesterdayCompare: "Forecast $91.50 → Actual $84.77",
        history: [
          { date: "Oct 30", action: "EXIT / CASH", compare: "$91.50 → $84.77", acc: "92.6%", result: "WIN" },
          { date: "Oct 29 PM", action: "BUY @ $100.25", compare: "$103.80 → $102.39", acc: "98.6%", result: "WIN" },
          { date: "Oct 29 AM", action: "WAIT IN CASH", compare: "$104.20 → $100.25", acc: "96.1%", result: "WIN" },
          { date: "Oct 28", action: "WAIT IN CASH", compare: "$96.65 → $107.35", acc: "90.0%", result: "LOSS" }
        ]
      }
    ];

    function render() {
      const all = DATA.flatMap(d => d.history);
      const totalWins = all.filter(r => r.result === "WIN").length;
      document.getElementById("totalWinRate").textContent =
        `${Math.round((totalWins / all.length) * 100)}% (${totalWins}/${all.length})`;

      document.getElementById("grid").innerHTML = DATA.map(item => {
        const wins = item.history.filter(r => r.result === "WIN").length;
        const winRate = Math.round((wins / item.history.length) * 100);
        const boxStyle = item.actionColor === "emerald"
          ? "bg-emerald-500/15 border-emerald-500/50 text-emerald-300"
          : "bg-amber-500/15 border-amber-500/50 text-amber-300";

        return `
          <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">

            <!-- TOP ROW: TICKER + WIN RATE + $10K USD SIMULATOR -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <div>
                <h2 class="text-xl font-bold text-white">${item.ticker}</h2>
                <span class="text-xs text-slate-400">
                  WIN RATE: <strong class="text-emerald-400">${winRate}% (${wins}/${item.history.length})</strong>
                </span>
              </div>
              <div class="text-right bg-slate-950 border border-slate-800 px-3 py-1.5 rounded">
                <span class="text-[10px] text-slate-500 block">$10,000 USD SIM</span>
                <span class="text-sm font-bold ${item.simChange.startsWith('+') ? 'text-emerald-400' : 'text-amber-400'}">
                  ${item.simUSD} (${item.simChange})
                </span>
              </div>
            </div>

            <!-- 1. PRICE NOW -->
            <div class="bg-slate-950 border border-slate-800 rounded-lg p-3.5 flex items-baseline justify-between">
              <div>
                <span class="text-[10px] uppercase text-slate-500 block">Price Now</span>
                <span class="text-2xl font-bold text-white">${item.priceNow}</span>
              </div>
              <span class="text-xs font-semibold text-rose-400">${item.priceChange}</span>
            </div>

            <!-- 2. TOMORROW'S FORECAST & ACTION -->
            <div class="p-4 rounded-lg border ${boxStyle}">
              <div class="flex items-center justify-between text-xs uppercase opacity-80">
                <span>Action Signal</span>
                <span>Tomorrow Forecast</span>
              </div>
              <div class="flex items-baseline justify-between mt-1">
                <span class="text-xl font-extrabold">${item.action}</span>
                <span class="text-xl font-extrabold">${item.forecastTomorrow}</span>
              </div>
            </div>

            <!-- 3. YESTERDAY'S ACCURACY -->
            <div class="bg-slate-950 border border-slate-800 rounded-lg p-3.5 flex items-center justify-between">
              <div>
                <span class="text-[10px] uppercase text-slate-500 block">Yesterday's Accuracy</span>
                <span class="text-xs text-slate-300 mt-0.5 block">${item.yesterdayCompare}</span>
              </div>
              <span class="text-sm font-bold px-2.5 py-1 rounded ${
                item.yesterdayResult === 'WIN'
                  ? 'bg-emerald-500/20 text-emerald-400'
                  : 'bg-rose-500/20 text-rose-400'
              }">
                ${item.yesterdayResult} (${item.yesterdayAcc})
              </span>
            </div>

            <!-- PAST ACCURACY LOG -->
            <table class="w-full text-left text-xs border-t border-slate-800 pt-2">
              <thead>
                <tr class="text-[10px] text-slate-500 uppercase border-b border-slate-800">
                  <th class="py-1.5">Date</th>
                  <th class="py-1.5">Signal</th>
                  <th class="py-1.5">Forecast → Actual</th>
                  <th class="py-1.5 text-right">Result</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60">
                ${item.history.map(r => `
                  <tr>
                    <td class="py-2 text-slate-400">${r.date}</td>
                    <td class="py-2 text-slate-200">${r.action}</td>
                    <td class="py-2 text-slate-300">${r.compare}</td>
                    <td class="py-2 text-right font-bold ${r.result === 'WIN' ? 'text-emerald-400' : 'text-rose-400'}">
                      ${r.result} (${r.acc})
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>

          </section>
        `;
      }).join("");
    }

    render();
  </script>
</body>
</html>
