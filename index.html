<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>ModelSignal // Tamper-Proof Audit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #06090e;
      color: #f1f5f9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body class="min-h-screen antialiased p-4 md:p-8 max-w-5xl mx-auto space-y-6">

  <!-- TAMPER DETECTION BANNER (Hidden unless AI modifies a locked forecast) -->
  <div id="tamperBanner" class="hidden bg-rose-950/90 border-2 border-rose-500 text-rose-200 p-4 rounded-xl text-xs space-y-1"></div>

  <!-- HEADER -->
  <header class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
    <div class="flex items-center gap-2.5">
      <span class="h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
      <h1 class="text-sm font-bold tracking-widest text-white uppercase">MODELSIGNAL</h1>
      <span class="text-xs text-slate-500">31 OCT 2026 // 01:21 UTC</span>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <div id="integrityBadge" class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded text-slate-400">
        AUDIT LOCK: <span class="font-bold">--</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded">
        <span class="text-slate-400">TOTAL WIN RATE:</span>
        <span id="totalWinRate" class="text-emerald-400 font-bold ml-1">--%</span>
      </div>
    </div>
  </header>

  <!-- PARALLEL COLUMNS: LEFT = BTC-USD | RIGHT = SOXL -->
  <main id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></main>

  <script>
    // =========================================================================
    // 1. APPEND-ONLY HISTORICAL LEDGER (CHRONOLOGICAL: OLDEST -> NEWEST)
    //    No hardcoded "WIN"/"LOSS" or "$10,107" allowed.
    //    The engine computes Win/Loss, Accuracy %, and $10K Sim from raw numbers.
    // =========================================================================
    const IMMUTABLE_HISTORY = Object.freeze({
      "BTC-USD": Object.freeze([
        Object.freeze({
          id: "BTC-01",
          date: "Oct 29 AM",
          signal: "HOLD 50%",
          mode: "LONG",
          alloc: 0.50,
          spotAtIssue: 80050.00,
          forecastPrice: 80495.00,
          actualPrice: 81085.88,
          entryFill: 80050.00,
          exitFill: 81085.88
        }),
        Object.freeze({
          id: "BTC-02",
          date: "Oct 29 PM",
          signal: "HOLD 50%",
          mode: "LONG",
          alloc: 0.50,
          spotAtIssue: 81085.88,
          forecastPrice: 81650.00,
          actualPrice: 79993.11,
          entryFill: 81085.88,
          exitFill: 79993.11
        }),
        Object.freeze({
          id: "BTC-03",
          date: "Oct 30 AM",
          signal: "HOLD 50% (Stop $79.4K)",
          mode: "LONG",
          alloc: 0.50,
          spotAtIssue: 79993.11,
          forecastPrice: 79650.00,
          actualPrice: 77792.42,
          entryFill: 79993.11,
          exitFill: 79400.00 // Stopped out at $79,400
        }),
        Object.freeze({
          id: "BTC-04",
          date: "Oct 30 PM",
          signal: "WAIT IN CASH",
          mode: "CASH",
          alloc: 0.00,
          spotAtIssue: 77792.42,
          forecastPrice: 76800.00,
          actualPrice: 76954.25,
          entryFill: null,
          exitFill: null
        }),
        Object.freeze({
          id: "BTC-05",
          date: "Oct 31 AM",
          signal: "WAIT IN CASH",
          mode: "CASH",
          alloc: 0.00,
          spotAtIssue: 76954.25,
          forecastPrice: 76100.00,
          actualPrice: 77381.96,
          entryFill: null,
          exitFill: null
        })
      ]),
      "SOXL": Object.freeze([
        Object.freeze({
          id: "SOXL-01",
          date: "Oct 29 AM",
          signal: "WAIT IN CASH",
          mode: "CASH",
          alloc: 0.00,
          spotAtIssue: 101.08,
          forecastPrice: 96.65,
          actualPrice: 107.35,
          entryFill: null,
          exitFill: null
        }),
        Object.freeze({
          id: "SOXL-02",
          date: "Oct 29 PM",
          signal: "WAIT IN CASH",
          mode: "CASH",
          alloc: 0.00,
          spotAtIssue: 107.35,
          forecastPrice: 104.20,
          actualPrice: 100.25,
          entryFill: null,
          exitFill: null
        }),
        Object.freeze({
          id: "SOXL-03",
          date: "Oct 30 AM",
          signal: "BUY 50% @ $100.25",
          mode: "LONG",
          alloc: 0.50,
          spotAtIssue: 100.25,
          forecastPrice: 103.80,
          actualPrice: 102.39,
          entryFill: 100.25,
          exitFill: 102.39
        }),
        Object.freeze({
          id: "SOXL-04",
          date: "Oct 30 PM",
          signal: "BUY @ $85–$88 (Open $81.66)",
          mode: "LONG",
          alloc: 0.50,
          spotAtIssue: 84.77,
          forecastPrice: 89.50,
          actualPrice: 79.83,
          entryFill: 81.66, // Limit Buy @ $85 fills at $81.66 Market Open
          exitFill: 79.83
        }),
        Object.freeze({
          id: "SOXL-05",
          date: "Oct 31 AM",
          signal: "WAIT IN CASH",
          mode: "CASH",
          alloc: 0.00,
          spotAtIssue: 79.83,
          forecastPrice: 76.50,
          actualPrice: 77.05,
          entryFill: null,
          exitFill: null
        })
      ])
    });

    // =========================================================================
    // 2. LIVE SNAPSHOT & TOMORROW'S LOCKED FORECAST (SAVED TO LOCALSTORAGE)
    // =========================================================================
    const LIVE_STATE = Object.freeze({
      "BTC-USD": {
        priceNow: 77381.96,
        priceChange: "+0.26% (+201.54 Today)",
        changePositive: true,
        nextSignalId: "BTC-06",
        action: "WAIT IN CASH",
        actionColor: "amber",
        forecastTomorrow: 76850.00
      },
      "SOXL": {
        priceNow: 77.05,
        priceChange: "-24.75% (Low: $70.23 · AH: $77.18)",
        changePositive: false,
        nextSignalId: "SOXL-06",
        action: "WAIT IN CASH",
        actionColor: "amber",
        forecastTomorrow: 74.80
      }
    });

    // =========================================================================
    // 3. DETERMINISTIC ANTI-CHEAT SCORING ENGINE (NO MANUAL OVERRIDES)
    // =========================================================================
    function evaluateRow(row) {
      // Price proximity accuracy %
      const errorRatio = Math.abs(row.forecastPrice - row.actualPrice) / row.spotAtIssue;
      const accuracyPct = Math.max(0, (1 - errorRatio) * 100).toFixed(1) + "%";

      // Strict Win/Loss rules:
      // - LONG mode: WIN only if exitFill > entryFill
      // - CASH mode: WIN only if forecasted direction matches actual move from spotAtIssue
      let isWin = false;
      if (row.mode === "LONG") {
        isWin = row.exitFill > row.entryFill;
      } else if (row.mode === "CASH") {
        const predictedDelta = row.forecastPrice - row.spotAtIssue;
        const actualDelta = row.actualPrice - row.spotAtIssue;
        isWin = (predictedDelta < 0 && actualDelta < 0) || (predictedDelta > 0 && actualDelta > 0);
      }

      return {
        ...row,
        accuracyPct,
        result: isWin ? "WIN" : "LOSS"
      };
    }

    function simulate10K(rows) {
      let balance = 10000.00;
      for (const r of rows) {
        if (r.mode === "LONG" && r.alloc > 0 && r.entryFill && r.exitFill) {
          const tradeReturn = (r.exitFill - r.entryFill) / r.entryFill;
          balance = balance * (1 + r.alloc * tradeReturn);
        }
      }
      const pct = ((balance - 10000) / 10000) * 100;
      return {
        usd: "$" + Math.round(balance).toLocaleString("en-US"),
        pct: (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%",
        isPos: pct >= 0
      };
    }

    // FNV-1a 32-bit Hash for Ledger Immutability Check
    function computeLedgerHash(historyObj) {
      const payload = JSON.stringify(historyObj);
      let hash = 0x811c9dc5;
      for (let i = 0; i < payload.length; i++) {
        hash ^= payload.charCodeAt(i);
        hash = Math.imul(hash, 0x01000193);
      }
      return (hash >>> 0).toString(16).toUpperCase().padStart(8, "0");
    }

    // Check browser localStorage to ensure yesterday's active forecast was not altered
    function verifyLocalStorageLock() {
      const STORAGE_KEY = "ModelSignal_AuditLock_v1";
      const warnings = [];
      try {
        const savedRaw = localStorage.getItem(STORAGE_KEY);
        if (savedRaw) {
          const saved = JSON.parse(savedRaw);
          for (const ticker of ["BTC-USD", "SOXL"]) {
            const lockedCall = saved[ticker];
            if (!lockedCall) continue;
            const matchingHistoryRow = IMMUTABLE_HISTORY[ticker].find(r => r.id === lockedCall.nextSignalId);
            if (matchingHistoryRow) {
              if (
                matchingHistoryRow.forecastPrice !== lockedCall.forecastTomorrow ||
                matchingHistoryRow.signal !== lockedCall.action
              ) {
                warnings.push(
                  `[${ticker} ${lockedCall.nextSignalId}] Locked Forecast was "${lockedCall.action} @ ${lockedCall.forecastTomorrow}", but history was altered to "${matchingHistoryRow.signal} @ ${matchingHistoryRow.forecastPrice}"!`
                );
              }
            }
          }
        }
        // Lock current active forecasts for the next turn
        localStorage.setItem(STORAGE_KEY, JSON.stringify(LIVE_STATE));
      } catch (e) {
        // Ignore storage errors in sandboxed iframes
      }
      return warnings;
    }

    const fmt = (val, ticker) =>
      ticker === "BTC-USD"
        ? "$" + Number(val).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 })
        : "$" + Number(val).toFixed(2);

    function render() {
      const hash = computeLedgerHash(IMMUTABLE_HISTORY);
      const warnings = verifyLocalStorageLock();
      const badge = document.getElementById("integrityBadge");
      const banner = document.getElementById("tamperBanner");

      if (warnings.length > 0) {
        banner.classList.remove("hidden");
        banner.innerHTML = `<div class="font-bold uppercase">Tamper Alert — Past Forecast Modified:</div>` +
          warnings.map(w => `<div>• ${w}</div>`).join("");
        badge.innerHTML = `AUDIT LOCK: <span class="text-rose-400 font-bold">TAMPERED</span>`;
      } else {
        badge.innerHTML = `LOCKED HASH: <span class="text-cyan-400 font-bold">#${hash}</span>`;
      }

      let allEvaluated = [];

      const htmlCols = ["BTC-USD", "SOXL"].map(ticker => {
        const rawRows = IMMUTABLE_HISTORY[ticker];
        const evaluatedChrono = rawRows.map(evaluateRow);
        allEvaluated.push(...evaluatedChrono);

        const sim = simulate10K(evaluatedChrono);
        const historyDesc = [...evaluatedChrono].reverse(); // Newest first for display
        const latest = historyDesc[0];
        const live = LIVE_STATE[ticker];

        const wins = evaluatedChrono.filter(r => r.result === "WIN").length;
        const winRate = Math.round((wins / evaluatedChrono.length) * 100);

        const boxStyle = live.actionColor === "emerald"
          ? "bg-emerald-500/15 border-emerald-500/50 text-emerald-300"
          : "bg-amber-500/15 border-amber-500/50 text-amber-300";

        return `
          <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">

            <!-- TOP ROW: TICKER + WIN RATE + $10K USD SIMULATOR -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <div>
                <h2 class="text-xl font-bold text-white">${ticker}</h2>
                <span class="text-xs text-slate-400">
                  WIN RATE: <strong class="text-emerald-400">${winRate}% (${wins}/${evaluatedChrono.length})</strong>
                </span>
              </div>
              <div class="text-right bg-slate-950 border border-slate-800 px-3 py-1.5 rounded">
                <span class="text-[10px] text-slate-500 block">$10,000 USD SIM</span>
                <span class="text-sm font-bold ${sim.isPos ? 'text-emerald-400' : 'text-amber-400'}">
                  ${sim.usd} (${sim.pct})
                </span>
              </div>
            </div>

            <!-- 1. PRICE NOW -->
            <div class="bg-slate-950 border border-slate-800 rounded-lg p-3.5 flex items-baseline justify-between">
              <div>
                <span class="text-[10px] uppercase text-slate-500 block">Price Now</span>
                <span class="text-2xl font-bold text-white">${fmt(live.priceNow, ticker)}</span>
              </div>
              <span class="text-xs font-semibold ${live.changePositive ? 'text-emerald-400' : 'text-rose-400'}">
                ${live.priceChange}
              </span>
            </div>

            <!-- 2. TOMORROW'S FORECAST & ACTION -->
            <div class="p-4 rounded-lg border ${boxStyle}">
              <div class="flex items-center justify-between text-xs uppercase opacity-80">
                <span>Action Signal (${live.nextSignalId})</span>
                <span>Tomorrow Forecast</span>
              </div>
              <div class="flex items-baseline justify-between mt-1">
                <span class="text-xl font-extrabold">${live.action}</span>
                <span class="text-xl font-extrabold">${fmt(live.forecastTomorrow, ticker)}</span>
              </div>
            </div>

            <!-- 3. YESTERDAY'S ACCURACY -->
            <div class="bg-slate-950 border border-slate-800 rounded-lg p-3.5 flex items-center justify-between">
              <div>
                <span class="text-[10px] uppercase text-slate-500 block">Yesterday's Accuracy (${latest.id})</span>
                <span class="text-xs text-slate-300 mt-0.5 block">
                  Forecast ${fmt(latest.forecastPrice, ticker)} → Actual ${fmt(latest.actualPrice, ticker)}
                </span>
              </div>
              <span class="text-sm font-bold px-2.5 py-1 rounded ${
                latest.result === 'WIN'
                  ? 'bg-emerald-500/20 text-emerald-400'
                  : 'bg-rose-500/20 text-rose-400'
              }">
                ${latest.result} (${latest.accuracyPct})
              </span>
            </div>

            <!-- PAST ACCURACY LOG (COMPUTED BY ENGINE) -->
            <table class="w-full text-left text-xs border-t border-slate-800 pt-2">
              <thead>
                <tr class="text-[10px] text-slate-500 uppercase border-b border-slate-800">
                  <th class="py-1.5">Date</th>
                  <th class="py-1.5">Locked Signal</th>
                  <th class="py-1.5">Forecast → Actual</th>
                  <th class="py-1.5 text-right">Result</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60">
                ${historyDesc.map(r => `
                  <tr>
                    <td class="py-2 text-slate-400 whitespace-nowrap">${r.date}</td>
                    <td class="py-2 text-slate-200">${r.signal}</td>
                    <td class="py-2 text-slate-300 whitespace-nowrap">
                      ${fmt(r.forecastPrice, ticker)} → <strong class="text-white">${fmt(r.actualPrice, ticker)}</strong>
                    </td>
                    <td class="py-2 text-right font-bold whitespace-nowrap ${
                      r.result === 'WIN' ? 'text-emerald-400' : 'text-rose-400'
                    }">
                      ${r.result} (${r.accuracyPct})
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>

          </section>
        `;
      });

      const totalWins = allEvaluated.filter(r => r.result === "WIN").length;
      document.getElementById("totalWinRate").textContent =
        `${Math.round((totalWins / allEvaluated.length) * 100)}% (${totalWins}/${allEvaluated.length})`;

      document.getElementById("grid").innerHTML = htmlCols.join("");
    }

    render();
  </script>
</body>
</html>
