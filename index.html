<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>ModelSignal // Parallel Action & Accuracy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #06090e;
      color: #f1f5f9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body class="min-h-screen antialiased p-4 md:p-8 max-w-6xl mx-auto space-y-6">

  <!-- MINIMAL HEADER -->
  <header class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
    <div class="flex items-center gap-2.5">
      <span class="h-2.5 w-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <h1 class="text-sm font-bold tracking-widest text-white uppercase">MODELSIGNAL</h1>
      <span class="text-xs text-slate-500">2026-10-30 00:15 UTC</span>
    </div>
    <div class="flex items-center gap-3 text-xs">
      <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded">
        <span class="text-slate-400">TOTAL WIN RATE:</span>
        <span id="globalWinRate" class="text-emerald-400 font-bold ml-1">--%</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded">
        <span class="text-slate-400">MEAN FORECAST ACC:</span>
        <span id="globalAcc" class="text-cyan-400 font-bold ml-1">--%</span>
      </div>
    </div>
  </header>

  <!-- PARALLEL COLUMNS: LEFT = BTC-USD | RIGHT = SOXL -->
  <main id="parallelGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></main>

  <script>
    // =========================================================================
    // CLEAN DATA STARTING OCT 28–30 ONLY (OCT 26 & 27 REMOVED)
    // =========================================================================
    const ASSETS = {
      "BTC-USD": {
        name: "BTC-USD",
        simStart: 10000,
        simCurrent: 9879,
        simPct: "-1.21%",
        allocNow: "0% CASH (STOPPED @ $79.4K)",
        priceNow: 77792.42,
        changeToday: "-2.75% (Low $77,771)",
        tomorrowAction: "STAND ASIDE (0% CASH)",
        tomorrowNote: "Broke <$79,400 Stop | Wait for $75.5K–$76.8K base or >$79,400 reclaim",
        tomorrowTarget: 76800.00,
        badgeType: "WARN",
        history: [
          {
            date: "10-30 00:15",
            priorSignal: "HOLD 50% / CUT < $79.4K",
            forecastEY: 79650.00,
            actualPrice: 77792.42,
            accuracy: 97.61,
            verdict: "LOSS",
            simAfter: "HK$9,879 (-1.21%)"
          },
          {
            date: "10-29 13:37",
            priorSignal: "HOLD / ADD > $81.8K",
            forecastEY: 81650.00,
            actualPrice: 79993.11,
            accuracy: 97.93,
            verdict: "LOSS",
            simAfter: "HK$9,916 (-0.84%)"
          },
          {
            date: "10-29 00:39",
            priorSignal: "HOLD CORE (10-28)",
            forecastEY: 80495.00,
            actualPrice: 81085.88,
            accuracy: 99.27,
            verdict: "WIN",
            simAfter: "HK$10,052 (+0.52%)"
          }
        ]
      },
      "SOXL": {
        name: "SOXL",
        simStart: 10000,
        simCurrent: 10107,
        simPct: "+1.07%",
        allocNow: "50% -> 0% EXIT",
        priceNow: 102.39,
        changeToday: "-4.62% (AH: $88.92)",
        tomorrowAction: "EXIT @ OPEN / STAND ASIDE",
        tomorrowNote: "Lock +2.13% bounce ($100.25 -> $102.39) | AH printed $88.92 drop",
        tomorrowTarget: 91.50,
        badgeType: "WARN",
        history: [
          {
            date: "10-30 00:15",
            priorSignal: "BUY 50% @ $100.25",
            forecastEY: 103.80,
            actualPrice: 102.39,
            accuracy: 98.62,
            verdict: "WIN",
            simAfter: "HK$10,107 (+1.07%)"
          },
          {
            date: "10-29 13:40",
            priorSignal: "STAND ASIDE (0% CASH)",
            forecastEY: 104.20,
            actualPrice: 100.25,
            accuracy: 96.06,
            verdict: "WIN",
            simAfter: "HK$10,000 (0.00%)"
          },
          {
            date: "10-29 00:39",
            priorSignal: "STAND ASIDE (10-28)",
            forecastEY: 96.65,
            actualPrice: 107.35,
            accuracy: 90.03,
            verdict: "LOSS",
            simAfter: "HK$10,000 (0.00%)"
          }
        ]
      }
    };

    const fmt = (val, asset) =>
      asset === "BTC-USD"
        ? "$" + Number(val).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        : "$" + Number(val).toFixed(2);

    const signalStyle = (type) => {
      if (type === "BUY") return "bg-emerald-500/15 border-emerald-500/50 text-emerald-300";
      if (type === "WARN") return "bg-amber-500/15 border-amber-500/50 text-amber-300";
      return "bg-cyan-500/15 border-cyan-500/50 text-cyan-300";
    };

    function render() {
      const allRows = [...ASSETS["BTC-USD"].history, ...ASSETS["SOXL"].history];
      const totalWins = allRows.filter(r => r.verdict === "WIN").length;
      const meanAcc = allRows.reduce((s, r) => s + r.accuracy, 0) / allRows.length;

      document.getElementById("globalWinRate").textContent =
        `${Math.round((totalWins / allRows.length) * 100)}% (${totalWins}/${allRows.length})`;
      document.getElementById("globalAcc").textContent = `${meanAcc.toFixed(2)}%`;

      const cols = ["BTC-USD", "SOXL"].map(key => {
        const item = ASSETS[key];
        const wins = item.history.filter(r => r.verdict === "WIN").length;
        const winRate = Math.round((wins / item.history.length) * 100);
        const avgAcc = (item.history.reduce((s, r) => s + r.accuracy, 0) / item.history.length).toFixed(2);
        const latestAudit = item.history[0];

        return `
          <section class="bg-slate-900/90 border border-slate-800 rounded-xl p-5 flex flex-col justify-between space-y-5">

            <!-- HEADER: ASSET + WIN RATE + 10K SIMULATOR -->
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
              <div>
                <h2 class="text-lg font-bold text-white tracking-wide">${item.name}</h2>
                <span class="text-xs text-slate-400">
                  WIN RATE: <strong class="text-emerald-400">${winRate}% (${wins}/${item.history.length})</strong>
                  · MEAN ACC: <strong class="text-cyan-400">${avgAcc}%</strong>
                </span>
              </div>
              <div class="text-right bg-slate-950 border border-slate-800 px-3 py-1.5 rounded">
                <span class="text-[10px] text-slate-500 block uppercase">HK$10K SIMULATOR (${item.allocNow})</span>
                <span class="text-xs font-bold ${item.simCurrent >= 10000 ? 'text-emerald-400' : 'text-amber-400'}">
                  HK$${item.simCurrent.toLocaleString()} (${item.simPct})
                </span>
              </div>
            </div>

            <!-- 1. BIG SIGNAL / TOMORROW'S ACTION -->
            <div class="p-4 rounded-lg border ${signalStyle(item.badgeType)}">
              <div class="flex items-center justify-between text-[11px] uppercase tracking-wider opacity-80">
                <span>1 // Tomorrow's Action (Big Signal)</span>
                <span>Next 24H Target: <strong>${fmt(item.tomorrowTarget, item.name)}</strong></span>
              </div>
              <div class="text-2xl font-extrabold tracking-tight mt-1.5">${item.tomorrowAction}</div>
              <div class="text-xs mt-1 opacity-90">${item.tomorrowNote}</div>
            </div>

            <!-- 2. PRICE NOW & 3. YESTERDAY'S ACCURACY -->
            <div class="grid grid-cols-2 gap-3">
              <div class="bg-slate-950 border border-slate-800/90 rounded-lg p-3.5">
                <span class="text-[10px] uppercase tracking-wider text-slate-500 block">2 // Price Now</span>
                <div class="text-xl font-bold text-white mt-1">${fmt(item.priceNow, item.name)}</div>
                <span class="text-xs font-semibold ${item.changeToday.startsWith('+') ? 'text-emerald-400' : 'text-rose-400'}">
                  ${item.changeToday}
                </span>
              </div>

              <div class="bg-slate-950 border border-slate-800/90 rounded-lg p-3.5">
                <span class="text-[10px] uppercase tracking-wider text-slate-500 block">3 // Yesterday's Accuracy</span>
                <div class="text-xl font-bold mt-1 ${latestAudit.verdict === 'WIN' ? 'text-emerald-400' : 'text-rose-400'}">
                  ${latestAudit.accuracy}% (${latestAudit.verdict})
                </div>
                <span class="text-xs text-slate-400 block">
                  Target: ${fmt(latestAudit.forecastEY, item.name)}
                </span>
              </div>
            </div>

            <!-- OCT 28–30 LOG ONLY -->
            <div class="border-t border-slate-800 pt-3">
              <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-2">Oct 28–30 Audit Log (Clean Start)</div>
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="text-[10px] text-slate-500 uppercase border-b border-slate-800">
                    <th class="py-1.5">Date</th>
                    <th class="py-1.5">Prior Action</th>
                    <th class="py-1.5">Target vs Actual</th>
                    <th class="py-1.5 text-right">Forecast Acc</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60">
                  ${item.history.map(r => `
                    <tr>
                      <td class="py-2 text-slate-400 whitespace-nowrap">${r.date}</td>
                      <td class="py-2 text-slate-200 font-medium">${r.priorSignal}</td>
                      <td class="py-2 text-slate-300 whitespace-nowrap">
                        ${fmt(r.forecastEY, item.name)} → <strong class="text-white">${fmt(r.actualPrice, item.name)}</strong>
                      </td>
                      <td class="py-2 text-right font-bold whitespace-nowrap ${r.verdict === 'WIN' ? 'text-emerald-400' : 'text-rose-400'}">
                        ${r.accuracy}% (${r.verdict})
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>

          </section>
        `;
      });

      document.getElementById("parallelGrid").innerHTML = cols.join("");
    }

    render();
  </script>
</body>
</html>
