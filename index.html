<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>ModelSignal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #06090e;
      color: #f1f5f9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body class="min-h-screen antialiased p-4 md:p-8 max-w-6xl mx-auto space-y-6">

  <!-- MINIMAL HEADER -->
  <header class="flex items-center justify-between border-b border-slate-800 pb-4">
    <div class="flex items-center gap-2.5">
      <span class="h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
      <h1 class="text-sm font-bold tracking-widest text-white uppercase">MODELSIGNAL</h1>
      <span id="asOfDate" class="text-xs text-slate-500">--</span>
    </div>
    <div class="text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded">
      <span class="text-slate-400">EXECUTED TRADE WIN RATE:</span>
      <span id="totalWinRate" class="text-emerald-400 font-bold ml-1">--</span>
    </div>
  </header>

  <!-- PARALLEL COLUMNS: BTC-USD (LEFT) | SOXL (RIGHT) -->
  <main id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></main>

  <script>
    document.write('<script src="signals.js?v=' + Date.now() + '"><\/script>');
  </script>

  <script>
    const fmtUSD = (val) =>
      "$" + Number(val).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const fmtSignedUSD = (val) => {
      const sign = val > 0 ? "+" : val < 0 ? "-" : "";
      return sign + "$" + Math.abs(val).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    const fmtQty = (qty, ticker) =>
      ticker === "BTC-USD" ? `${qty.toFixed(6)} BTC` : `${qty.toFixed(2)} sh`;

    function runPortfolioSim(tuples, ticker) {
      let balance = 10000.00;
      let wins = 0;
      let executedTrades = 0;

      const rows = tuples.map(t => {
        const [id, date, signal, mode, alloc, spotAtIssue, forecastPrice, actualPrice, entryFill, exitFill] = t;
        let qty = 0;
        let pnl = 0;
        let isTrade = mode === "LONG" && alloc > 0 && entryFill != null && exitFill != null;

        if (isTrade) {
          const deployed = balance * alloc;
          qty = deployed / entryFill;
          pnl = qty * (exitFill - entryFill);
          balance += pnl;
          executedTrades++;
          if (pnl > 0) wins++;
        }

        return {
          id,
          date,
          signal,
          mode,
          alloc,
          spotAtIssue,
          forecastPrice,
          actualPrice,
          entryFill,
          exitFill,
          qty,
          pnl,
          balanceAfter: balance,
          isTrade
        };
      });

      return {
        balance,
        netPnl: balance - 10000.00,
        wins,
        executedTrades,
        rows
      };
    }

    function render() {
      const data = window.MODEL_SIGNAL_DATA;
      if (!data) return;

      document.getElementById("asOfDate").textContent = data.asOfDate;

      let totalWins = 0;
      let totalTrades = 0;

      const colsHtml = Object.keys(data.history).map(ticker => {
        const sim = runPortfolioSim(data.history[ticker], ticker);
        totalWins += sim.wins;
        totalTrades += sim.executedTrades;

        const live = data.live[ticker];
        const descRows = [...sim.rows].reverse();

        // Compute live next order size if action is BUY
        const nextCapital = sim.balance * (live.alloc || 0);
        const refFill = live.orderRefPrice || live.priceNow;
        const nextQty = nextCapital > 0 ? fmtQty(nextCapital / refFill, ticker) : "0 (100% Cash)";
        const nextOrderText = nextCapital > 0
          ? `Buy ${nextQty} @ ${fmtUSD(refFill)} (${fmtUSD(nextCapital)})`
          : `0 Qty · Hold ${fmtUSD(sim.balance)} Cash`;

        const decisionStyle = live.alloc > 0
          ? "bg-emerald-500/15 border-emerald-500/50 text-emerald-300"
          : "bg-amber-500/15 border-amber-500/50 text-amber-300";

        return `
          <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">

            <!-- TOP BAR: TICKER & SIMULATED POOL BALANCE -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <div>
                <h2 class="text-xl font-bold text-white">${ticker}</h2>
                <span class="text-xs text-slate-400">
                  TRADES WON: <strong class="text-emerald-400">${sim.wins}/${sim.executedTrades}</strong>
                </span>
              </div>
              <div class="text-right bg-slate-950 border border-slate-800 px-3 py-1.5 rounded">
                <span class="text-[10px] text-slate-500 block">$10,000 SIMULATED POOL</span>
                <span class="text-sm font-bold ${sim.netPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
                  ${fmtUSD(sim.balance)} (${fmtSignedUSD(sim.netPnl)})
                </span>
              </div>
            </div>

            <!-- 1. PRICE NOW & 2. PRICE INFERRED -->
            <div class="grid grid-cols-2 gap-3">
              <div class="bg-slate-950 border border-slate-800 rounded-lg p-3.5">
                <span class="text-[10px] uppercase text-slate-500 block">1 // Price Now</span>
                <span class="text-xl font-bold text-white mt-0.5 block">${fmtUSD(live.priceNow)}</span>
                <span class="text-[11px] ${live.isUp ? 'text-emerald-400' : 'text-rose-400'}">${live.priceNote}</span>
              </div>
              <div class="bg-slate-950 border border-slate-800 rounded-lg p-3.5">
                <span class="text-[10px] uppercase text-slate-500 block">2 // Price Inferred (24H)</span>
                <span class="text-xl font-bold text-cyan-400 mt-0.5 block">${fmtUSD(live.forecastTomorrow)}</span>
                <span class="text-[11px] text-slate-400">Signal ID: ${live.nextSignalId}</span>
              </div>
            </div>

            <!-- 3. DECISION ENGINE -->
            <div class="p-4 rounded-lg border ${decisionStyle}">
              <div class="flex items-center justify-between text-[10px] uppercase opacity-80">
                <span>3 // Decision Engine</span>
                <span>Target Execution</span>
              </div>
              <div class="flex items-baseline justify-between mt-1 gap-2">
                <span class="text-lg font-extrabold">${live.action}</span>
                <span class="text-xs font-bold text-right">${nextOrderText}</span>
              </div>
            </div>

            <!-- 4. SIMULATED TRADE RESULTS (BUY / SELL / QTY / P&L) -->
            <div class="border-t border-slate-800 pt-3">
              <div class="text-[10px] uppercase text-slate-500 mb-2">
                4 // Simulated Trade Ledger (Buy Price · Sell Price · Quantity · P&L)
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr class="text-[10px] text-slate-500 uppercase border-b border-slate-800">
                      <th class="py-1.5 pr-2">Date</th>
                      <th class="py-1.5 px-2">Inferred → Actual</th>
                      <th class="py-1.5 px-2">Qty & Buy → Sell Fill</th>
                      <th class="py-1.5 pl-2 text-right">Trade P&L / Pool</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60">
                    ${descRows.map(r => `
                      <tr>
                        <td class="py-2 pr-2 text-slate-400 whitespace-nowrap">
                          ${r.date}
                          <span class="block text-[10px] text-slate-500">${r.signal}</span>
                        </td>
                        <td class="py-2 px-2 text-slate-300 whitespace-nowrap">
                          ${fmtUSD(r.forecastPrice)} → <strong class="text-white">${fmtUSD(r.actualPrice)}</strong>
                        </td>
                        <td class="py-2 px-2 whitespace-nowrap">
                          ${r.isTrade ? `
                            <span class="text-white font-semibold block">${fmtQty(r.qty, ticker)}</span>
                            <span class="text-[10px] text-slate-400">
                              Buy ${fmtUSD(r.entryFill)} → Sell ${fmtUSD(r.exitFill)}
                            </span>
                          ` : `
                            <span class="text-slate-500">0 Qty (No Trade)</span>
                          `}
                        </td>
                        <td class="py-2 pl-2 text-right whitespace-nowrap">
                          <span class="font-bold block ${
                            !r.isTrade ? 'text-slate-500' : r.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'
                          }">
                            ${r.isTrade ? fmtSignedUSD(r.pnl) : '$0.00'}
                          </span>
                          <span class="text-[10px] text-slate-500">Pool: ${fmtUSD(r.balanceAfter)}</span>
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            </div>

          </section>
        `;
      });

      const pct = totalTrades > 0 ? Math.round((totalWins / totalTrades) * 100) : 0;
      document.getElementById("totalWinRate").textContent = `${pct}% (${totalWins}/${totalTrades} Trades)`;
      document.getElementById("grid").innerHTML = colsHtml.join("");
    }

    render();
  </script>
</body>
</html>
