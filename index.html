<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>ModelSignal // Actionable AI Signals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    body { background-color: #06090e; color: #f1f5f9; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
</head>
<body class="min-h-screen antialiased p-4 md:p-6 max-w-5xl mx-auto space-y-5">

  <!-- TOP BAR -->
  <header class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3">
    <div class="flex items-center gap-2.5">
      <span class="h-2.5 w-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <h1 class="text-sm font-bold tracking-wider text-white uppercase">MODELSIGNAL</h1>
      <span class="text-xs text-slate-500">// ACTIONABLE SIGNALS ONLY</span>
    </div>

    <div class="flex items-center gap-2 text-xs">
      <div class="bg-slate-900 border border-slate-800 px-2.5 py-1 rounded">
        <span class="text-slate-400">ACCURACY:</span>
        <span id="statAccuracy" class="text-emerald-400 font-bold ml-1">--%</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 px-2.5 py-1 rounded">
        <span class="text-slate-400">WIN RATE:</span>
        <span id="statWinRate" class="text-cyan-400 font-bold ml-1">--%</span>
      </div>
    </div>
  </header>

  <!-- PRIMARY DELIVERABLE: LIVE ACTIONABLE SIGNALS -->
  <section id="signalCards" class="grid grid-cols-1 md:grid-cols-2 gap-4"></section>

  <!-- PRICE VS MODEL TARGET CHART -->
  <section class="bg-slate-900/60 border border-slate-800 rounded-lg p-4">
    <div class="flex items-center justify-between mb-2">
      <span class="text-[11px] uppercase tracking-wider text-slate-400">Actual Price vs. Model Target E[Y]</span>
      <div class="flex gap-1.5 text-xs">
        <button onclick="renderChart('BTC-USD')" id="btnChartBTC" class="px-2.5 py-0.5 rounded border">BTC-USD</button>
        <button onclick="renderChart('SOXL')" id="btnChartSOXL" class="px-2.5 py-0.5 rounded border">SOXL</button>
      </div>
    </div>
    <div class="h-48 w-full">
      <canvas id="signalChart"></canvas>
    </div>
  </section>

  <!-- COMPACT AUDIT LOG (SINGLE-LINE ROWS, NO JUNK) -->
  <section class="bg-slate-900/60 border border-slate-800 rounded-lg overflow-hidden">
    <div class="px-4 py-2.5 border-b border-slate-800 flex items-center justify-between">
      <span class="text-[11px] uppercase tracking-wider text-slate-400">Signal & Accuracy Track Record</span>
      <div class="flex gap-1.5 text-xs" id="filterBtns">
        <button onclick="setFilter('ALL')" data-f="ALL" class="px-2 py-0.5 rounded border border-cyan-500/50 bg-cyan-500/10 text-cyan-300">ALL</button>
        <button onclick="setFilter('BTC-USD')" data-f="BTC-USD" class="px-2 py-0.5 rounded border border-slate-800 bg-slate-950 text-slate-400">BTC-USD</button>
        <button onclick="setFilter('SOXL')" data-f="SOXL" class="px-2 py-0.5 rounded border border-slate-800 bg-slate-950 text-slate-400">SOXL</button>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
        <thead>
          <tr class="border-b border-slate-800 text-slate-500 uppercase text-[10px] bg-slate-950/70">
            <th class="py-2.5 px-3">Date (UTC)</th>
            <th class="py-2.5 px-3">Asset</th>
            <th class="py-2.5 px-3">Actionable Signal</th>
            <th class="py-2.5 px-3">Execution Levels</th>
            <th class="py-2.5 px-3">Spot Price</th>
            <th class="py-2.5 px-3">Next 24H E[Y]</th>
            <th class="py-2.5 px-3">Ratio</th>
            <th class="py-2.5 px-3">Prior Call Audit</th>
          </tr>
        </thead>
        <tbody id="ledgerBody" class="divide-y divide-slate-800/60"></tbody>
      </table>
    </div>
  </section>

  <script>
    // =========================================================================
    // LEDGER DATA: PASTE NEW DAILY OBJECTS HERE (AUTO-SORTED BY DATE)
    // =========================================================================
    const LEDGER = [
      {
        date: "2026-10-29 00:39",
        asset: "BTC-USD",
        price: 81085.88,
        change_pct: "+0.52% (24H High $81,709)",
        expected_price: 81650.00,
        prob_ratio: "1.80x",
        decision: "HOLD CORE / ADD > $81,800",
        levels: "Add: >$81,800 | Bid: $80,300 | Stop: <$79,800",
        prior_expected: 80495.00,
        prior_accuracy: 99.27,
        audit_result: "WIN"
      },
      {
        date: "2026-10-29 00:39",
        asset: "SOXL",
        price: 107.35,
        change_pct: "+6.20%",
        expected_price: 104.20,
        prob_ratio: "0.78x",
        decision: "STAND ASIDE / WAIT FOR DIP",
        levels: "Reload: $98.50–$101.00 | Stop: <$96.00",
        prior_expected: 96.65,
        prior_accuracy: 90.03,
        audit_result: "LOSS"
      },
      {
        date: "2026-10-28 00:13",
        asset: "SOXL",
        price: 101.08,
        change_pct: "+11.69% (AH $98.58)",
        expected_price: 96.65,
        prob_ratio: "0.83x",
        decision: "STAND ASIDE / WAIT FOR DIP",
        levels: "Reload: $90.50–$93.00 | Brk: >$102.50",
        prior_expected: 94.80,
        prior_accuracy: 93.79,
        audit_result: "LOSS"
      },
      {
        date: "2026-10-28 00:13",
        asset: "BTC-USD",
        price: 80667.52,
        change_pct: "+0.82%",
        expected_price: 80495.00,
        prob_ratio: "1.20x",
        decision: "TRIM ADDS @ $81K / HOLD CORE",
        levels: "Trim: $80.7K–$81.2K | Reload: $79.4K | Stop: <$78.8K",
        prior_expected: 80250.00,
        prior_accuracy: 99.48,
        audit_result: "WIN"
      },
      {
        date: "2026-10-27 14:29",
        asset: "SOXL",
        price: 96.33,
        change_pct: "+6.44%",
        expected_price: 94.80,
        prob_ratio: "0.83x",
        decision: "TRIM / TAKE PROFIT",
        levels: "Trim: $96.30–$98.00 | Reload: $89.00",
        prior_expected: 93.85,
        prior_accuracy: 97.43,
        audit_result: "WIN"
      },
      {
        date: "2026-10-27 14:28",
        asset: "BTC-USD",
        price: 80008.01,
        change_pct: "+0.71%",
        expected_price: 80250.00,
        prob_ratio: "2.25x",
        decision: "HOLD / ADD > $80,150",
        levels: "Add: >$80,150 | Stop: <$79,250",
        prior_expected: 79575.00,
        prior_accuracy: 99.46,
        audit_result: "WIN"
      },
      {
        date: "2026-10-27 10:17",
        asset: "BTC-USD",
        price: 79441.08,
        change_pct: "-0.71%",
        expected_price: 79575.00,
        prob_ratio: "1.27x",
        decision: "HOLD / BID $79,265",
        levels: "Bid: $79,265 | Stop: <$76,000",
        prior_expected: 79812.00,
        prior_accuracy: 99.53,
        audit_result: "WIN"
      },
      {
        date: "2026-10-26 23:51",
        asset: "BTC-USD",
        price: 79804.03,
        change_pct: "+0.61%",
        expected_price: 80145.00,
        prob_ratio: "2.33x",
        decision: "HOLD CORE",
        levels: "Brk: >$80,697 | Stop: <$74,000",
        prior_expected: 79410.00,
        prior_accuracy: 99.51,
        audit_result: "WIN"
      },
      {
        date: "2026-10-26 20:00",
        asset: "SOXL",
        price: 90.50,
        change_pct: "+8.31%",
        expected_price: 93.85,
        prob_ratio: "2.25x",
        decision: "HOLD FOR $97 TRIM",
        levels: "Target: $97.20 | Stop: <$84.20",
        prior_expected: 89.20,
        prior_accuracy: 98.56,
        audit_result: "WIN"
      },
      {
        date: "2026-10-23 16:00",
        asset: "SOXL",
        price: 83.56,
        change_pct: "+1.77%",
        expected_price: 89.20,
        prob_ratio: "3.67x",
        decision: "LONG / ACCUMULATE",
        levels: "Target: $91.50 | Stop: <$80.50",
        prior_expected: 83.85,
        prior_accuracy: 99.65,
        audit_result: "WIN"
      }
    ];

    let activeFilter = 'ALL';
    let chartInstance = null;

    const fmtPrice = (val, asset) =>
      asset === 'BTC-USD'
        ? '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        : '$' + Number(val).toFixed(2);

    const badgeStyle = (dec) => {
      if (dec.includes('TRIM') || dec.includes('STAND ASIDE') || dec.includes('WAIT'))
        return 'bg-amber-500/20 text-amber-300 border-amber-500/50';
      if (dec.includes('LONG') || dec.includes('BUY') || dec.includes('ADD'))
        return 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50';
      return 'bg-cyan-500/20 text-cyan-300 border-cyan-500/50';
    };

    function init() {
      // Auto-sort newest first so order never breaks
      LEDGER.sort((a, b) => b.date.localeCompare(a.date));

      const audited = LEDGER.filter(x => x.prior_accuracy != null);
      const meanAcc = audited.reduce((s, x) => s + x.prior_accuracy, 0) / (audited.length || 1);
      const wins = audited.filter(x => x.audit_result === 'WIN').length;

      document.getElementById('statAccuracy').textContent = meanAcc.toFixed(2) + '%';
      document.getElementById('statWinRate').textContent = Math.round((wins / (audited.length || 1)) * 100) + '% (' + wins + '/' + audited.length + ')';

      renderSignalCards();
      renderTable();
      renderChart('BTC-USD');
    }

    function renderSignalCards() {
      const latestBTC = LEDGER.find(x => x.asset === 'BTC-USD');
      const latestSOXL = LEDGER.find(x => x.asset === 'SOXL');

      document.getElementById('signalCards').innerHTML = [latestBTC, latestSOXL].map(item => `
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-400">${item.asset} // ${item.date} UTC</span>
            <span class="text-[11px] font-bold ${item.audit_result === 'WIN' ? 'text-emerald-400' : 'text-rose-400'}">
              LAST CALL: ${item.audit_result} (${item.prior_accuracy}%)
            </span>
          </div>

          <!-- PRIMARY ACTIONABLE SIGNAL -->
          <div class="p-3 rounded border ${badgeStyle(item.decision)}">
            <div class="text-[10px] uppercase tracking-wider opacity-75">Actionable Signal</div>
            <div class="text-base font-bold mt-0.5">${item.decision}</div>
            <div class="text-xs mt-1 opacity-90">${item.levels}</div>
          </div>

          <!-- CORE NUMBERS ONLY -->
          <div class="grid grid-cols-3 gap-2 text-xs bg-slate-950 p-2.5 rounded border border-slate-800/80">
            <div>
              <span class="text-[10px] text-slate-500 block">SPOT PRICE</span>
              <span class="font-bold text-white">${fmtPrice(item.price, item.asset)}</span>
              <span class="text-[10px] block ${item.change_pct.startsWith('+') ? 'text-emerald-400' : 'text-rose-400'}">${item.change_pct}</span>
            </div>
            <div>
              <span class="text-[10px] text-slate-500 block">24H TARGET E[Y]</span>
              <span class="font-bold text-cyan-400">${fmtPrice(item.expected_price, item.asset)}</span>
            </div>
            <div>
              <span class="text-[10px] text-slate-500 block">PROB RATIO</span>
              <span class="font-bold text-purple-300">${item.prob_ratio}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setFilter(f) {
      activeFilter = f;
      document.querySelectorAll('#filterBtns button').forEach(b => {
        b.className = b.dataset.f === f
          ? 'px-2 py-0.5 rounded border border-cyan-500/50 bg-cyan-500/10 text-cyan-300'
          : 'px-2 py-0.5 rounded border border-slate-800 bg-slate-950 text-slate-400';
      });
      renderTable();
    }

    function renderTable() {
      const rows = activeFilter === 'ALL' ? LEDGER : LEDGER.filter(x => x.asset === activeFilter);
      document.getElementById('ledgerBody').innerHTML = rows.map(r => `
        <tr class="hover:bg-slate-800/40">
          <td class="py-2.5 px-3 text-slate-400">${r.date}</td>
          <td class="py-2.5 px-3 font-bold text-white">${r.asset}</td>
          <td class="py-2.5 px-3">
            <span class="px-2 py-0.5 rounded border text-[11px] font-bold ${badgeStyle(r.decision)}">${r.decision}</span>
          </td>
          <td class="py-2.5 px-3 text-slate-300">${r.levels}</td>
          <td class="py-2.5 px-3 font-bold text-white">
            ${fmtPrice(r.price, r.asset)} <span class="text-[10px] font-normal ${r.change_pct.startsWith('+') ? 'text-emerald-400' : 'text-rose-400'}">${r.change_pct}</span>
          </td>
          <td class="py-2.5 px-3 font-bold text-cyan-400">${fmtPrice(r.expected_price, r.asset)}</td>
          <td class="py-2.5 px-3 text-purple-300">${r.prob_ratio}</td>
          <td class="py-2.5 px-3 font-bold ${r.audit_result === 'WIN' ? 'text-emerald-400' : 'text-rose-400'}">
            ${r.audit_result} (${r.prior_accuracy}%)
          </td>
        </tr>
      `).join('');
    }

    function renderChart(asset) {
      document.getElementById('btnChartBTC').className = asset === 'BTC-USD'
        ? 'px-2.5 py-0.5 rounded border border-cyan-500/50 bg-cyan-500/10 text-cyan-300'
        : 'px-2.5 py-0.5 rounded border border-slate-800 bg-slate-950 text-slate-400';
      document.getElementById('btnChartSOXL').className = asset === 'SOXL'
        ? 'px-2.5 py-0.5 rounded border border-cyan-500/50 bg-cyan-500/10 text-cyan-300'
        : 'px-2.5 py-0.5 rounded border border-slate-800 bg-slate-950 text-slate-400';

      const series = LEDGER.filter(x => x.asset === asset).slice().reverse();
      const ctx = document.getElementById('signalChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: series.map(x => x.date.slice(5)),
          datasets: [
            {
              label: `${asset} Actual`,
              data: series.map(x => x.price),
              borderColor: '#f8fafc',
              borderWidth: 2,
              pointRadius: 4,
              tension: 0.2
            },
            {
              label: `Model Target E[Y]`,
              data: series.map(x => x.prior_expected),
              borderColor: '#22d3ee',
              borderDash: [4, 4],
              borderWidth: 2,
              pointRadius: 4,
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#94a3b8', font: { family: 'monospace', size: 11 } } } },
          scales: {
            x: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
          }
        }
      });
    }

    init();
  </script>
</body>
</html>
