<body class="min-h-screen antialiased p-4 md:p-8 max-w-5xl mx-auto space-y-6">

  <!-- TAMPER BANNER -->

  <!-- HEADER -->

    <div class="flex items-center gap-2.5">
      <span class="h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
      <h1 class="text-sm font-bold tracking-widest text-white uppercase">MODELSIGNAL</h1>
      <span class="text-xs text-slate-500">04 NOV 2026</span>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <div id="integrityBadge" class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded text-slate-400"></div>
      <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded">
        <span class="text-slate-400">WIN RATE:</span>
        <span id="totalWinRate" class="text-emerald-400 font-bold ml-1">--%</span>
      </div>
    </div>
  </header>

  <!-- TWO COLUMNS: BTC-USD & SOXL -->
  <main id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></main>

  <script>
    // =========================================================================

        }),
        Object.freeze({

        }),
        Object.freeze({

        }),
        Object.freeze({
          id: "SOXL-05",

        }),
        Object.freeze({

        }),
        Object.freeze({

          alloc: 0.50,

        })
      ])
    });

    // =========================================================================
    // 2. TODAY'S SNAPSHOT & NEXT LOCKED FORECAST (DEEP FROZEN)
    // =========================================================================
    const LIVE_STATE = Object.freeze({
      "BTC-USD": Object.freeze({
        priceNow: 75832.72,
        priceNote: "-1.3% (24h)",
        isUp: false,
        nextSignalId: "BTC-09",
        action: "WAIT IN CASH",
        actionColor: "amber",
        forecastTomorrow: 75100.00
      }),
      "SOXL": Object.freeze({
        priceNow: 73.12,
        priceNote: "+7.3% (OVN: $66.06)",
        isUp: true,
        nextSignalId: "SOXL-08",
        action: "WAIT IN CASH",
        actionColor: "amber",
        forecastTomorrow: 66.50
      })
    });

    // =========================================================================
    // 3. CHAINED SEAL VERIFIER & INTUITIVE SCORING ENGINE
    // =========================================================================
    function computeRowSeal(prevSealNum, r) {
      const s1 = Math.round(r.spotAtIssue * 100);
      const s2 = Math.round(r.forecastPrice * 100);
      const s3 = Math.round(r.actualPrice * 100);
      const s4 = Math.round((r.alloc || 0) * 100);
      const m = r.mode === "LONG" ? 7 : 3;
      const next = (prevSealNum * 31 + s1 * 3 + s2 * 7 + s3 * 11 + s4 * 13 + m * 17) % 1000000;
      return {
        num: next,
        str: String(next).padStart(6, "0")
      };
    }

    function formatPct(rawPct) {
      const absVal = Math.abs(rawPct);
      if (absVal === 0) return "0.0%";
      const decimals = absVal < 0.1 ? 2 : 1;
      const sign = rawPct > 0 ? "+" : "-";
      return `${sign}${absVal.toFixed(decimals)}%`;
    }

    function evaluateTickerHistory(rows) {
      let prevSeal = 100000;
      return rows.map(r => {
        const calc = computeRowSeal(prevSeal, r);
        prevSeal = calc.num;
        const sealValid = calc.str === r.seal;

        // Forecast proximity % (capped at 99.9% unless exact match)
        const errorRatio = Math.abs(r.forecastPrice - r.actualPrice) / r.spotAtIssue;
        const rawAcc = Math.max(0, (1 - errorRatio) * 100);
        const accDisplay = (errorRatio === 0 ? "100.0" : Math.min(99.9, rawAcc).toFixed(1)) + "% Acc";

        // Intuitive outcome label (eliminates -0% and double negatives)
        let isWin = false;
        let outcomeText = "";

        if (r.mode === "LONG") {
          const rawTradePct = ((r.exitFill - r.entryFill) / r.entryFill) * 100;
          isWin = r.exitFill > r.entryFill;
          outcomeText = isWin
            ? `WIN · Gained ${formatPct(rawTradePct)}`
            : `LOSS · ${formatPct(rawTradePct)}`;
        } else {
          const rawMovePct = ((r.actualPrice - r.spotAtIssue) / r.spotAtIssue) * 100;
          const predDelta = r.forecastPrice - r.spotAtIssue;
          const actDelta = r.actualPrice - r.spotAtIssue;
          isWin = (predDelta < 0 && actDelta < 0) || (predDelta > 0 && actDelta > 0);
          if (isWin && actDelta < 0) {
            outcomeText = `WIN · Avoided ${formatPct(rawMovePct)}`;
          } else if (isWin) {
            outcomeText = `WIN · On Target`;
          } else {
            outcomeText = `LOSS · Missed ${formatPct(rawMovePct)}`;
          }
        }

        return {
          ...r,
          accWhole: accDisplay,
          outcomeText,
          result: isWin ? "WIN" : "LOSS",
          sealValid
        };
      });
    }

    function simulate10K(rows) {
      let balance = 10000.00;
      for (const r of rows) {
        if (r.mode === "LONG" && r.alloc > 0 && r.entryFill != null && r.exitFill != null) {
          const ret = (r.exitFill - r.entryFill) / r.entryFill;
          balance = balance * (1 + r.alloc * ret);
        }
      }
      const rawPct = ((balance - 10000) / 10000) * 100;
      const isPos = balance >= 10000;
      return {
        usd: "$" + Math.round(balance).toLocaleString("en-US"),
        pct: formatPct(rawPct),
        isPos
      };
    }

    const fmt = (val, ticker) =>
      ticker === "BTC-USD"
        ? "$" + Math.round(Number(val)).toLocaleString("en-US")
        : "$" + Number(val).toFixed(2);

    function render() {
      let allRows = [];
      let brokenSeals = [];

      const colsHtml = ["BTC-USD", "SOXL"].map(ticker => {
        const evaluated = evaluateTickerHistory(IMMUTABLE_HISTORY[ticker]);
        allRows.push(...evaluated);
        evaluated.forEach(r => {
          if (!r.sealValid) brokenSeals.push(`${r.id} (${r.date})`);
        });

        const sim = simulate10K(evaluated);
        const desc = [...evaluated].reverse();
        const latest = desc[0];
        const live = LIVE_STATE[ticker];

        const wins = evaluated.filter(r => r.result === "WIN").length;
        const winRate = Math.round((wins / evaluated.length) * 100);

        const actionBoxStyle = live.actionColor === "emerald"
          ? "bg-emerald-500/15 border-emerald-500/50 text-emerald-300"
          : "bg-amber-500/15 border-amber-500/50 text-amber-300";

        const noteColor = live.isUp ? "text-emerald-300" : "text-rose-300";

        return `
          <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">

            <!-- HEADER: TICKER + $10K POOL -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <div>
                <h2 class="text-xl font-bold text-white">${ticker}</h2>
                <span class="text-xs text-slate-400">
                  WIN RATE: <strong class="text-emerald-400">${winRate}% (${wins}/${evaluated.length})</strong>
                </span>
              </div>
              <div class="text-right bg-slate-950 border border-slate-800 px-3 py-1.5 rounded">
                <span class="text-[10px] text-slate-500 block">$10K POOL</span>
                <span class="text-sm font-bold ${sim.isPos ? 'text-emerald-400' : 'text-amber-400'}">
                  ${sim.usd} (${sim.pct})
                </span>
              </div>
            </div>

            <!-- 1. NOW & NEXT FORECAST -->
            <div class="p-4 rounded-lg border ${actionBoxStyle} space-y-2">
              <div class="flex items-center justify-between text-xs opacity-90">
                <span>NOW: <strong class="text-white">${fmt(live.priceNow, ticker)}</strong> <span class="${noteColor}">(${live.priceNote})</span></span>
                <span>NEXT LOCK: #${live.nextSignalId}</span>
              </div>
              <div class="flex items-baseline justify-between pt-1">
                <div>
                  <span class="text-[10px] uppercase block opacity-75">Suggested Action</span>
                  <span class="text-xl font-extrabold">${live.action}</span>
                </div>
                <div class="text-right">
                  <span class="text-[10px] uppercase block opacity-75">Next Forecast</span>
                  <span class="text-xl font-extrabold">${fmt(live.forecastTomorrow, ticker)}</span>
                </div>
              </div>
            </div>

            <!-- 2. LATEST SETTLED OUTCOME -->
            <div class="bg-slate-950 border border-slate-800 rounded-lg p-3.5 flex items-center justify-between gap-2">
              <div>
                <span class="text-[10px] uppercase text-slate-500 block">
                  Latest Settled (${latest.date} · ${latest.signal})
                </span>
                <span class="text-xs text-slate-300 mt-0.5 block">
                  Forecast ${fmt(latest.forecastPrice, ticker)} → Actual <strong class="text-white">${fmt(latest.actualPrice, ticker)}</strong>
                </span>
              </div>
              <div class="text-right">
                <span class="inline-block text-xs font-bold px-2.5 py-1 rounded ${
                  latest.result === 'WIN'
                    ? 'bg-emerald-500/20 text-emerald-400'
                    : 'bg-rose-500/20 text-rose-400'
                }">
                  ${latest.outcomeText}
                </span>
                <span class="block text-[10px] text-slate-500 mt-1">${latest.accWhole} · Seal #${latest.seal}</span>
              </div>
            </div>

            <!-- 3. PAST TRADES & FORECASTS (CLEAN SPACING + PER-ROW SEAL) -->
            <div class="overflow-x-auto border-t border-slate-800 pt-2">
              <table class="w-full text-left text-xs border-collapse">
                <thead>
                  <tr class="text-[10px] text-slate-500 uppercase border-b border-slate-800">
                    <th class="py-2 pr-3">Date</th>
                    <th class="py-2 px-2">Action</th>
                    <th class="py-2 px-2">Forecast → Actual</th>
                    <th class="py-2 pl-2 text-right">Outcome</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60">
                  ${desc.map(r => `
                    <tr>
                      <td class="py-2.5 pr-3 text-slate-400 whitespace-nowrap">
                        ${r.date}
                        <span class="block text-[9px] ${r.sealValid ? 'text-slate-600' : 'text-rose-400 font-bold'}">
                          ${r.sealValid ? '#' + r.seal : 'TAMPERED'}
                        </span>
                      </td>
                      <td class="py-2.5 px-2 whitespace-nowrap">
                        <span class="px-2 py-0.5 rounded bg-slate-800 text-slate-200 text-[11px]">
                          ${r.signal}
                        </span>
                      </td>
                      <td class="py-2.5 px-2 text-slate-300 whitespace-nowrap">
                        ${fmt(r.forecastPrice, ticker)} → <strong class="text-white">${fmt(r.actualPrice, ticker)}</strong>
                        ${r.mode === "LONG" && r.entryFill != null && r.exitFill != null ? `
                          <span class="block text-[10px] text-slate-500">
                            Fill: ${fmt(r.entryFill, ticker)} → ${fmt(r.exitFill, ticker)}
                          </span>
                        ` : ""}
                      </td>
                      <td class="py-2.5 pl-2 text-right whitespace-nowrap">
                        <span class="font-bold ${r.result === 'WIN' ? 'text-emerald-400' : 'text-rose-400'}">
                          ${r.outcomeText}
                        </span>
                        <span class="block text-[10px] text-slate-500">${r.accWhole}</span>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>

          </section>
        `;
      });

      // Header Integrity & Win Rate
      const badge = document.getElementById("integrityBadge");
      const banner = document.getElementById("tamperBanner");
      if (brokenSeals.length > 0) {
        banner.classList.remove("hidden");
        banner.innerHTML = `<div class="font-bold">TAMPER ALERT — Historical Row Seal Broken: ${brokenSeals.join(", ")}</div>`;
        badge.innerHTML = `ROW SEALS: <span class="text-rose-400 font-bold">TAMPERED</span>`;
      } else {
        badge.innerHTML = `ROW SEALS: <span class="text-cyan-400 font-bold">ALL ${allRows.length} LOCKED</span>`;
      }

      const totalWins = allRows.filter(r => r.result === "WIN").length;
      document.getElementById("totalWinRate").textContent =
        `${Math.round((totalWins / allRows.length) * 100)}% (${totalWins}/${allRows.length})`;

      document.getElementById("grid").innerHTML = colsHtml.join("");
    }

    render();
  </script>
